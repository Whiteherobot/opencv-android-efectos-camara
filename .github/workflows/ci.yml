name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: OpenCV para Android
        run: |
          curl -sL -o /tmp/opencv.zip https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip
          unzip -q /tmp/opencv.zip -d /tmp
          echo "OPENCV_ANDROID_SDK=/tmp/OpenCV-android-sdk" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
